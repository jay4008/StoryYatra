# /etc/nginx/sites-available/storyyatra-api  (domain baad mein badalna)
server {
    listen 80;
    server_name api.technoplatsolution.online;
    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        # Behind Cloudflare this is the real client IP, which the rate limits key on.
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Direct HTTPS (no Cloudflare in front), so the client IP is the connection's own address.
server {
    server_name storyyatra.43-242-227-59.nip.io;
    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/storyyatra.43-242-227-59.nip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/storyyatra.43-242-227-59.nip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = storyyatra.43-242-227-59.nip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name storyyatra.43-242-227-59.nip.io;
    return 404; # managed by Certbot


}